# Local development Postgres only. Not a statement on how the team deploys —
# that question (Docker/Terraform/AWS vs. a local demo) is still open with the TA.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: movierec
      POSTGRES_PASSWORD: movierec
      POSTGRES_DB: movierec
    ports:
      - "5432:5432"
    volumes:
      - movierec-postgres-data:/var/lib/postgresql/data

volumes:
  movierec-postgres-data:
