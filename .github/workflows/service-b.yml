name: Service B checks
on:
  push:
    branches: [member-3-service-b-retrieval]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '*service-b*'
      - 'configs/**'
      - '.github/workflows/service-b.yml'
permissions:
  contents: read
jobs:
  service-b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements-service-b*.txt'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-service-b-model.txt
      - name: Run regression suite
        run: python -m unittest discover -s tests -q
      - name: Validate Compose and build CPU image
        run: |
          docker compose -f compose.service-b.yml config --quiet
          docker build -f Dockerfile.service-b -t movie-rec-service-b:ci .
      - name: Smoke test container HTTP contracts
        run: |
          docker run -d --name service-b-ci -p 127.0.0.1:8001:8001 -e SERVICE_B_STATE_SECRET=ci-only-continuation-secret-at-least-32-bytes movie-rec-service-b:ci
          python -m src.app.service_b.smoke_http --output outputs/reports/service-b-ci/http.json
      - name: Container logs
        if: always()
        run: docker logs service-b-ci || true
      - name: Clean up container
        if: always()
        run: docker rm -f service-b-ci || true
